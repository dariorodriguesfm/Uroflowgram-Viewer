<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uroflujometría — Visor</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #070b14;
  --surface:   #0d1526;
  --surface2:  #121d35;
  --border:    #1a2a48;
  --border2:   #243556;
  --text:      #dce8ff;
  --text2:     #6b84ad;
  --text3:     #3d5278;
  --blue:      #4da6ff;
  --blue-dim:  #1a4a8a;
  --red:       #ff5c5c;
  --green:     #00e676;
  --sidebar-w: 265px;
}

html, body { height: 100%; background: var(--bg); color: var(--text);
  font-family: 'Outfit', sans-serif; font-size: 14px; overflow: hidden; }

#app { display: flex; height: 100vh; overflow: hidden; }

/* ── SIDEBAR ── */
#sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-header { padding: 18px 16px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-logo   { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--blue); display: block; margin-bottom: 5px; }
.sidebar-title  { font-size: 16px; font-weight: 600; color: var(--text); }
.sidebar-count  { font-size: 11px; color: var(--text2); margin-top: 3px; font-family: 'JetBrains Mono', monospace; }

#study-list { flex: 1; overflow-y: auto; padding: 6px 0; }
#study-list::-webkit-scrollbar { width: 3px; }
#study-list::-webkit-scrollbar-track { background: transparent; }
#study-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.study-item { padding: 9px 14px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.12s; display: flex; flex-direction: column; gap: 1px; }
.study-item:hover  { background: var(--surface2); border-left-color: var(--blue-dim); }
.study-item.active { background: var(--surface2); border-left-color: var(--blue); }
.item-index { font-size: 10px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }
.item-date  { font-size: 13px; font-weight: 500; color: var(--text); font-family: 'JetBrains Mono', monospace; }
.item-time  { font-size: 11px; color: var(--text2); font-family: 'JetBrains Mono', monospace; }
.study-item.active .item-date { color: var(--blue); }

/* ── MAIN ── */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* 1. Title bar */
#topbar { display: flex; align-items: center; padding: 11px 22px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#study-title { font-size: 15px; font-weight: 600; color: var(--text); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.02em; }

/* 2. Metrics — ABOVE chart */
#metrics-panel { flex-shrink: 0; padding: 9px 16px; border-bottom: 1px solid var(--border); }
.metrics-header { font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text3); font-weight: 700; margin-bottom: 7px; }
#metrics-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; }
.metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 6px 8px; }
.m-label { font-size: 9.5px; color: var(--text2); margin-bottom: 2px; line-height: 1.3; }
.m-value { font-size: 14px; font-weight: 600; font-family: 'JetBrains Mono', monospace; color: var(--text); }
.m-unit  { font-size: 9px; color: var(--text3); font-family: 'JetBrains Mono', monospace; margin-left: 1px; }
.metric-card.hi-red  .m-value { color: var(--red);  }
.metric-card.hi-blue .m-value { color: var(--blue); }

/* 3. Chart */
#chart-wrapper { flex: 1; min-height: 0; position: relative; }
#chart { position: absolute; inset: 0; }

/* Clinical stage box — in chart right margin */
#stage-box {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  width: 130px; z-index: 5; pointer-events: none;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 6px; padding: 12px 10px; text-align: center;
}
.stage-label { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text3); font-weight: 700; margin-bottom: 7px; display: block; }
.stage-value { font-size: 13px; font-weight: 600; color: var(--blue); line-height: 1.45; display: block; }

/* Loading / error overlays */
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 10; flex-direction: column; gap: 12px; }
.spinner { width: 28px; height: 28px; border: 2px solid var(--border2); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.75s linear infinite; }
.loading-text { font-size: 12px; color: var(--text2); font-family: 'JetBrains Mono', monospace; }
@keyframes spin { to { transform: rotate(360deg); } }
#error-msg { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; background: var(--bg); z-index: 10; color: var(--red); font-size: 13px; }

/* 4. Nav bar — BELOW chart, big and centered */
#nav-bar { display: flex; align-items: center; justify-content: center; gap: 24px; padding: 14px 24px; border-top: 1px solid var(--border); flex-shrink: 0; }
.nav-btn-lg { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); padding: 10px 30px; border-radius: 6px; cursor: pointer; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 500; transition: all 0.12s; white-space: nowrap; }
.nav-btn-lg:hover    { background: var(--border2); border-color: var(--blue); color: var(--blue); }
.nav-btn-lg:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
#nav-center    { text-align: center; min-width: 130px; }
#nav-info      { font-size: 22px; font-weight: 600; font-family: 'JetBrains Mono', monospace; color: var(--text); margin-bottom: 5px; }
#progress-track { width: 130px; height: 3px; background: var(--border); border-radius: 1px; overflow: hidden; margin: 0 auto; }
#progress-fill  { height: 100%; background: var(--blue); border-radius: 1px; transition: width 0.3s ease; }
</style>
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">Uroflujometría</span>
      <div class="sidebar-title">Visor de Estudios</div>
      <div class="sidebar-count" id="sidebar-count">Cargando…</div>
    </div>
    <div id="study-list"></div>
  </aside>

  <main id="main">

    <div id="topbar">
      <div id="study-title">—</div>
    </div>

    <div id="metrics-panel">
      <div class="metrics-header">Parámetros clínicos</div>
      <div id="metrics-grid"></div>
    </div>

    <div id="chart-wrapper">
      <div id="loading">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-text">Cargando estudios…</div>
      </div>
      <div id="error-msg"></div>
      <div id="chart"></div>
      <div id="stage-box">
        <span class="stage-label">Estadio clínico</span>
        <span class="stage-value" id="stage-value">—</span>
      </div>
    </div>

    <div id="nav-bar">
      <button class="nav-btn-lg" id="btn-prev" onclick="navigate(-1)" disabled>← Anterior</button>
      <div id="nav-center">
        <div id="nav-info">— / —</div>
        <div id="progress-track"><div id="progress-fill" style="width:0%"></div></div>
      </div>
      <button class="nav-btn-lg" id="btn-next" onclick="navigate(1)" disabled>Siguiente →</button>
    </div>

  </main>
</div>

<script>
let studies = [], currentIdx = -1, lastProcessed = null;
let globalMaxTime = null, globalMaxVol = null, globalRangesReady = false;

// ── INIT ──
async function init() {
  try {
    const res = await fetch('archivos.json');
    if (!res.ok) throw new Error('No se encontró archivos.json');
    const raw = await res.json();
    studies = raw.map(s => typeof s === 'string' ? {name:s, stage:'—'} : s);
    document.getElementById('sidebar-count').textContent =
      `${studies.length} estudio${studies.length!==1?'s':''}`;
    buildSidebar();
    if (studies.length > 0) await loadStudy(0);
    precomputeRanges();
  } catch(e) {
    document.getElementById('sidebar-count').textContent = 'Error al cargar';
    showErr(e.message);
  }
}

// ── BACKGROUND PRECOMPUTE (global axis ranges) ──
async function precomputeRanges() {
  try {
    const texts = await Promise.all(
      studies.map(s => fetch(`mediciones/${s.name}.txt`).then(r=>r.ok?r.text():null).catch(()=>null))
    );
    let maxT = 0, maxV = 0;
    for (const text of texts) {
      if (!text) continue;
      try {
        const filt = filtrarGlitches(parseTxt(text));
        if (filt.length < 2) continue;
        const tUs = filt.map(r=>r[0]), masa = filt.map(r=>r[1]);
        const t0  = Math.min(...tUs);
        const tEnd = (Math.max(...tUs) - t0) * 1e-6;
        const vMax = Math.max(...masa) - Math.min(...masa);
        if (tEnd > maxT) maxT = tEnd;
        if (vMax  > maxV) maxV = vMax;
      } catch {}
    }
    globalMaxTime = Math.ceil(maxT * 1.08);
    globalMaxVol  = Math.ceil(maxV * 1.12);
    globalRangesReady = true;
    if (lastProcessed !== null) renderChart(lastProcessed);  // re-render with fixed axes
  } catch {}
}

// ── SIDEBAR ──
function buildSidebar() {
  const list = document.getElementById('study-list');
  list.innerHTML = '';
  studies.forEach((s, i) => {
    const {date, time} = parseName(s.name);
    const div = document.createElement('div');
    div.className = 'study-item'; div.id = `si-${i}`;
    div.innerHTML = `<span class="item-index">#${String(i+1).padStart(2,'0')}</span>
      <span class="item-date">${date}</span><span class="item-time">${time}</span>`;
    div.onclick = () => loadStudy(i);
    list.appendChild(div);
  });
}

function parseName(name) {
  const clean = name.replace(/^uro_/,''), parts = clean.split('_');
  const dp = parts[0], tp = parts[1] ? parts[1].replace('hs','') : null;
  const dd=dp.slice(0,2), mm=dp.slice(2,4), yy=dp.slice(4,6);
  const months=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const date = `${dd} ${months[parseInt(mm,10)-1]||mm} 20${yy}`;
  let time = '—';
  if (tp) {
    let hh, mn;
    if (tp.length>=3) { mn=tp.slice(-2); hh=tp.slice(0,-2).padStart(2,'0'); }
    else              { hh=tp.padStart(2,'0'); mn='00'; }
    time = `${hh}:${mn} hs`;
  }
  return {date, time};
}

// ── NAVIGATION ──
function navigate(dir) {
  const ni = currentIdx + dir;
  if (ni>=0 && ni<studies.length) loadStudy(ni);
}

function updateNav() {
  const n = studies.length;
  document.getElementById('btn-prev').disabled = currentIdx <= 0;
  document.getElementById('btn-next').disabled = currentIdx >= n-1;
  document.getElementById('nav-info').textContent = `${currentIdx+1} / ${n}`;
  document.getElementById('progress-fill').style.width = (n>1?(currentIdx/(n-1))*100:100)+'%';
  document.querySelectorAll('.study-item').forEach(el=>el.classList.remove('active'));
  const a = document.getElementById(`si-${currentIdx}`);
  if (a) { a.classList.add('active'); a.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

// ── LOAD STUDY ──
async function loadStudy(idx) {
  if (idx<0||idx>=studies.length) return;
  currentIdx = idx; updateNav();
  const s = studies[idx], {date,time} = parseName(s.name);
  document.getElementById('study-title').textContent = `${date}  —  ${time}`;
  document.getElementById('stage-value').textContent  = s.stage || '—';
  document.title = `${date} ${time} — Uroflujometría`;
  setLoading(true,'Procesando…'); hideErr();
  try {
    const res = await fetch(`mediciones/${s.name}.txt`);
    if (!res.ok) throw new Error(`No se pudo cargar: ${s.name}.txt`);
    const proc = processData(await res.text());
    lastProcessed = proc;
    renderChart(proc);
    renderMetrics(proc.metrics);
  } catch(e) { showErr(e.message); }
  finally    { setLoading(false); }
}

function setLoading(v,msg) {
  document.getElementById('loading').style.display = v?'flex':'none';
  if (msg) document.getElementById('loading-text').textContent = msg;
}
function showErr(msg) { const el=document.getElementById('error-msg'); el.textContent='⚠ '+msg; el.style.display='flex'; }
function hideErr()    { document.getElementById('error-msg').style.display='none'; }

// ── DATA PROCESSING ──
function processData(text) {
  const filt    = filtrarGlitches(parseTxt(text));
  const tUs     = filt.map(r=>r[0]), masa = filt.map(r=>r[1]);
  const t0      = Math.min(...tUs);
  const tiempo  = tUs.map(t=>(t-t0)*1e-6);
  const volumen = savgolFilter(calibration(masa), 51, 2);
  let flujo     = savgolFilter(gradient(volumen, tiempo), 51, 2).map(v=>Math.max(0,v));

  const N=3, SENS=0.01;
  const idxInicio = encontrarAumento(volumen, N, SENS, 0);
  const tInicio   = idxInicio!==null ? tiempo[idxInicio] : tiempo[0];
  const idxPico   = argmax(flujo);
  const idxFin    = encontrarDiferencia(volumen, N, SENS, idxPico);
  const tFin      = idxFin!==null ? tiempo[idxFin] : tiempo[tiempo.length-1];

  return { tiempo, volumen, flujo, tInicio, tFin,
           metrics: calcMetrics(tiempo,volumen,flujo,tInicio,tFin,idxInicio,idxFin,idxPico) };
}

function parseTxt(text) {
  const data=[];
  for (const line of text.trim().split('\n')) {
    const p=line.trim().split(/[\t ]+/);
    if (p.length>=2) { const x=parseFloat(p[0]),y=parseFloat(p[1]); if (!isNaN(x)&&!isNaN(y)) data.push([x,y]); }
  }
  return data;
}

function filtrarGlitches(data) {
  if (data.length<3) return data;
  const out=[data[0]];
  for (let i=1;i<data.length-1;i++) {
    if (Math.abs(data[i][1]-(data[i-1][1]+data[i+1][1])/2)<=10) out.push(data[i]);
  }
  out.push(data[data.length-1]); return out;
}

function calibration(masa) { const b=Math.min(...masa); return masa.map(v=>v-b); }

function invertMatrix(M) {
  const n=M.length;
  const aug=M.map((row,i)=>[...row,...Array.from({length:n},(_,j)=>i===j?1:0)]);
  for (let col=0;col<n;col++) {
    let mx=col;
    for (let r=col+1;r<n;r++) if (Math.abs(aug[r][col])>Math.abs(aug[mx][col])) mx=r;
    [aug[col],aug[mx]]=[aug[mx],aug[col]];
    const piv=aug[col][col]; if (Math.abs(piv)<1e-12) continue;
    for (let j=0;j<2*n;j++) aug[col][j]/=piv;
    for (let r=0;r<n;r++) { if (r===col) continue; const f=aug[r][col]; for (let j=0;j<2*n;j++) aug[r][j]-=f*aug[col][j]; }
  }
  return aug.map(row=>row.slice(n));
}

function sgCoeffs(winSize, center, polyOrder) {
  const po=Math.min(polyOrder,winSize-1);
  const A=Array.from({length:winSize},(_,i)=>Array.from({length:po+1},(_,j)=>Math.pow(i-center,j)));
  const AtA=Array.from({length:po+1},(_,i)=>Array.from({length:po+1},(_,j)=>A.reduce((s,row)=>s+row[i]*row[j],0)));
  const inv=invertMatrix(AtA);
  return Array.from({length:winSize},(_,k)=>inv[0].reduce((s,v,i)=>s+v*A[k][i],0));
}

function savgolFilter(y, windowLen, polyOrder) {
  if (windowLen%2===0) windowLen++;
  const m=(windowLen-1)/2, n=y.length, ic=sgCoeffs(windowLen,m,polyOrder), bc={}, res=new Array(n);
  for (let i=0;i<n;i++) {
    const i0=Math.max(0,i-m), i1=Math.min(n-1,i+m), w=i1-i0+1;
    let co; if (w===windowLen) { co=ic; } else { const k=`${w}_${i-i0}`; if (!bc[k]) bc[k]=sgCoeffs(w,i-i0,polyOrder); co=bc[k]; }
    let v=0; for (let j=0;j<w;j++) v+=co[j]*y[i0+j]; res[i]=v;
  }
  return res;
}

function gradient(y, x) {
  const n=y.length, g=new Array(n);
  g[0]=(y[1]-y[0])/(x[1]-x[0]);
  for (let i=1;i<n-1;i++) g[i]=(y[i+1]-y[i-1])/(x[i+1]-x[i-1]);
  g[n-1]=(y[n-1]-y[n-2])/(x[n-1]-x[n-2]); return g;
}

function encontrarAumento(vol,n,sens,start) {
  for (let i=start+n;i<vol.length;i++) {
    let ok=true; for (let j=i-n;j<i;j++) if (vol[i]-vol[j]<=sens){ok=false;break;} if (ok) return i;
  } return null;
}

function encontrarDiferencia(vol,n,sens,start) {
  for (let i=start+n;i<vol.length;i++) {
    let ok=true; for (let j=i-n;j<i;j++) if (Math.abs(vol[i]-vol[j])>=sens){ok=false;break;} if (ok) return i;
  } return null;
}

function argmax(arr) { let mi=0; for (let i=1;i<arr.length;i++) if (arr[i]>arr[mi]) mi=i; return mi; }

function calcMetrics(tiempo,volumen,flujo,tInicio,tFin,idxInicio,idxFin,idxPico) {
  const tiempoTotal=tFin-tInicio, volumenTotal=Math.max(...volumen), qMaximo=Math.max(...flujo);
  const tAQmax=tiempo[idxPico]-tInicio, causalProm=tiempoTotal>0?volumenTotal/tiempoTotal:0;
  const vol90=0.9*volumenTotal; let idx90=volumen.findIndex(v=>v>=vol90); if (idx90<0) idx90=volumen.length-1;
  const T90=Math.max(0,tiempo[idx90]-tInicio), qM90=idx90>0?flujo.slice(0,idx90).reduce((s,v)=>s+v,0)/idx90:0;
  let idxT2=tiempo.findIndex(t=>t>tInicio+2); if (idxT2<0) idxT2=tiempo.length-1;
  const q2seg=flujo[idxT2]||0, volHastaQmax=volumen[idxPico], tDescenso=tFin-tiempo[idxPico];
  const i0=idxInicio||0, i1=idxFin||tiempo.length-1;
  let pausas=0; for (let i=i0;i<=i1;i++) if (flujo[i]<=0) pausas++;
  const dt=tiempo.length>11?tiempo[11]-tiempo[10]:0.09;
  const tPausas=Math.max(0,pausas*dt), tNeto=Math.max(0,tiempoTotal-tPausas);
  return {qMaximo,qM90,causalProm,q2seg,tAQmax,T90,volumenTotal,volHastaQmax,tiempoTotal,tNeto,tDescenso,tPausas};
}

// ── RENDER CHART ──
function renderChart({tiempo, volumen, flujo, tInicio, tFin}) {
  const xRange  = globalRangesReady ? [0, globalMaxTime] : undefined;
  const y1Range = globalRangesReady ? [0, globalMaxVol]  : undefined;

  Plotly.newPlot('chart', [
    { x:tiempo, y:volumen, name:'Volumen (mL)', type:'scatter', mode:'lines', line:{color:'#4da6ff',width:2}, yaxis:'y1' },
    { x:tiempo, y:flujo,   name:'Flujo (mL/s)', type:'scatter', mode:'lines', line:{color:'#ff5c5c',width:2}, yaxis:'y2' }
  ], {
    paper_bgcolor:'transparent', plot_bgcolor:'#0d1526',
    font:{family:'Outfit, sans-serif', color:'#7a91b8', size:12},
    margin:{l:58, r:178, t:14, b:44},
    autosize:true,
    xaxis:{
      title:{text:'Tiempo (s)',font:{size:12}}, range:xRange,
      gridcolor:'#182840', zerolinecolor:'#182840',
      tickfont:{family:'JetBrains Mono',size:11}
    },
    yaxis:{
      title:{text:'Volumen (mL)',font:{color:'#4da6ff',size:12}},
      tickfont:{color:'#4da6ff',family:'JetBrains Mono',size:11},
      range:y1Range, gridcolor:'#0e1e36', zerolinecolor:'#182840'
    },
    yaxis2:{
      title:{text:'Flujo (mL/s)',font:{color:'#ff5c5c',size:12}},
      tickfont:{color:'#ff5c5c',family:'JetBrains Mono',size:11},
      overlaying:'y', side:'right', range:[0,50], showgrid:false, zeroline:false
    },
    legend:{x:0.01,y:0.99,bgcolor:'rgba(13,21,38,0.85)',bordercolor:'#1a2a48',borderwidth:1,font:{size:12}},
    shapes:[
      {type:'line',xref:'x',yref:'paper',x0:tInicio,x1:tInicio,y0:0,y1:1,line:{color:'#00e676',width:1.5,dash:'dash'}},
      {type:'line',xref:'x',yref:'paper',x0:tFin,   x1:tFin,   y0:0,y1:1,line:{color:'#00e676',width:1.5,dash:'dash'}}
    ],
    annotations:[
      {xref:'x',yref:'paper',x:tInicio,y:1.02,text:'inicio',showarrow:false,font:{color:'#00e676',size:10},xanchor:'center'},
      {xref:'x',yref:'paper',x:tFin,   y:1.02,text:'fin',   showarrow:false,font:{color:'#00e676',size:10},xanchor:'center'}
    ]
  }, {responsive:true, displayModeBar:false});
}

// ── RENDER METRICS ──
function renderMetrics(m) {
  const items=[
    {label:'Q máximo',     value:m.qMaximo.toFixed(1),     unit:'mL/s',cls:'hi-red'},
    {label:'Q Medio 90%',  value:m.qM90.toFixed(1),        unit:'mL/s',cls:''},
    {label:'Q promedio',   value:m.causalProm.toFixed(1),  unit:'mL/s',cls:''},
    {label:'Q a 2 seg',    value:m.q2seg.toFixed(1),       unit:'mL/s',cls:''},
    {label:'T a Qmáx',     value:m.tAQmax.toFixed(1),      unit:'s',   cls:''},
    {label:'T de 90%',     value:m.T90.toFixed(1),         unit:'s',   cls:''},
    {label:'Vol. total',   value:m.volumenTotal.toFixed(1),unit:'mL',  cls:'hi-blue'},
    {label:'Vol. a Qmáx', value:m.volHastaQmax.toFixed(1),unit:'mL',  cls:''},
    {label:'T total',      value:m.tiempoTotal.toFixed(1), unit:'s',   cls:''},
    {label:'T neto',       value:m.tNeto.toFixed(1),       unit:'s',   cls:''},
    {label:'T descenso',   value:m.tDescenso.toFixed(1),   unit:'s',   cls:''},
    {label:'T pausas',     value:m.tPausas.toFixed(1),     unit:'s',   cls:''},
  ];
  document.getElementById('metrics-grid').innerHTML=items.map(it=>`
    <div class="metric-card ${it.cls}">
      <div class="m-label">${it.label}</div>
      <span class="m-value">${it.value}</span><span class="m-unit">${it.unit}</span>
    </div>`).join('');
}

document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')navigate(-1);if(e.key==='ArrowRight')navigate(1);});
window.addEventListener('resize',()=>{const el=document.getElementById('chart');if(el&&el.data)Plotly.Plots.resize(el);});

init();
</script>
</body>
</html>
